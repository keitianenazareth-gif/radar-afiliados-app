<div id="modal-campanha" class="modal-fundo">
    <div class="modal-caixa">
        <h3 id="modal-campanha-titulo"></h3>
        <div id="modal-campanha-corpo" class="resultado-campanha"></div>

        <button id="botao-copiar-dados" class="botao-secundario" onclick="copiarDadosCampanha()" style="margin-top:8px">
            📋 Copiar dados (pra colar no ChatGPT, Gemini, Claude...)
        </button>
        <p id="copiar-dados-status" class="linhas-info"></p>

        <div class="campanha-video">
            <div id="modo-video-opcoes" class="linhas-info" style="text-align:left;margin-bottom:8px">
                <label style="display:block;margin-bottom:4px">
                    <input type="radio" name="modo-video" value="padrao" checked onchange="resetarEstadoPromptVideo()">
                    Padrão (fundo borrado, grátis)
                </label>
                <label style="display:block;margin-bottom:4px">
                    <input type="radio" name="modo-video" value="fundo" onchange="resetarEstadoPromptVideo()">
                    Fundo por IA (cenário gerado, sua foto do produto por cima — ~1 crédito)
                </label>
                <label style="display:block">
                    <input type="radio" name="modo-video" value="video" onchange="resetarEstadoPromptVideo()">
                    Vídeo por IA (anima a foto real do produto — até 50 créditos)
                </label>
            </div>

            <div id="foto-manual-area" style="text-align:left;margin-bottom:10px">
                <label for="foto-manual-input" class="linhas-info" style="display:block;margin-bottom:4px">
                    📷 Usar outra foto (opcional — envie do celular em vez da foto da plataforma)
                </label>
                <input type="file" id="foto-manual-input" accept="image/png, image/jpeg, image/webp" capture="environment" onchange="enviarFotoManual(event)">
                <p id="foto-manual-status" class="linhas-info"></p>
            </div>

            <div id="prompt-video-ia-area" style="display:none;text-align:left;margin-bottom:10px">
                <label for="prompt-video-ia" class="linhas-info" style="display:block;margin-bottom:4px">
                    Prompt que vai pro Kairogen (revise e edite se quiser):
                </label>
                <textarea id="prompt-video-ia" rows="5" style="width:100%;box-sizing:border-box;padding:8px;border-radius:8px"></textarea>
            </div>

            <button id="botao-gerar-video" class="botao botao-destaque" onclick="gerarVideoCampanha()">
                🎬 GERAR VIDEO (15-30s)
            </button>
            <p id="video-status" class="linhas-info"></p>
            <div id="video-saida"></div>

            <button id="botao-instagram" class="botao botao-verde" onclick="postarNoInstagram()" style="display:none">
                📷 POSTAR NO INSTAGRAM
            </button>
            <p id="instagram-status" class="linhas-info"></p>
        </div>

        <button class="botao-secundario" onclick="fecharModalCampanha()">FECHAR</button>
    </div>
</div>
