name: Robo Automatico - Radar Afiliados

# Publica um Reel novo no Instagram. O agendamento (3x por dia) foi desligado
# em 03/11/2026 a pedido da Keiti: o plano e' 1 Reel por dia, com aprovacao.
# So roda manualmente: Actions -> Robo Automatico -> Run workflow.
on:
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r web/requirements.txt

      - name: Rodar o robo (escolhe produto, gera video, posta no Instagram)
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          KAIROGEN_REFRESH_TOKEN: ${{ secrets.KAIROGEN_REFRESH_TOKEN }}
          VIDEO_KEN_BURNS: "1"
        run: python robo_automatico.py
