name: Gerar APK - Radar Afiliados

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Criar arquivo de credenciais (a partir dos Secrets)
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os

          with open("credenciais_locais.py", "w") as f:
              f.write(f"SHOPEE_APP_ID = {os.environ['SHOPEE_APP_ID']!r}\n")
              f.write(f"SHOPEE_SECRET = {os.environ['SHOPEE_SECRET']!r}\n")
              f.write(f"ML_ACCESS_TOKEN = {os.environ.get('ML_ACCESS_TOKEN', '')!r}\n")
              f.write(f"ML_REFRESH_TOKEN = {os.environ.get('ML_REFRESH_TOKEN', '')!r}\n")
              f.write(f"ML_CLIENT_ID = {os.environ.get('ML_CLIENT_ID', '')!r}\n")
              f.write(f"ML_CLIENT_SECRET = {os.environ.get('ML_CLIENT_SECRET', '')!r}\n")
              f.write(f"GEMINI_API_KEY = {os.environ['GEMINI_API_KEY']!r}\n")

          for nome in ["SHOPEE_APP_ID", "SHOPEE_SECRET", "ML_CLIENT_ID", "ML_CLIENT_SECRET", "GEMINI_API_KEY"]:
              valor = os.environ.get(nome, "")
              print(f"{nome}: {len(valor)} caracteres")
          PYEOF

      - name: Reaproveitar a chave de assinatura entre builds
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore

      - name: Compilar o APK
        run: |
          mkdir -p ~/.android
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -v ~/.android:/home/user/.android \
            kivy/buildozer android debug

      - name: Localizar o APK gerado
        id: apk
        run: echo "caminho=$(find bin -name '*.apk' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: radar-afiliados-apk
          path: ${{ steps.apk.outputs.caminho }}
