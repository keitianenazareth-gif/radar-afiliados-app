name: Robo WhatsApp - Ofertas no grupo

# Os envios automaticos agora rodam no Railway (ver railway.toml), porque o
# agendamento do GitHub atrasava de 3 a 7 horas. Aqui so roda manualmente:
# Actions -> Robo WhatsApp -> Run workflow, escolhendo o modo:
#   teste          -> so mostra o proximo lote como avisos, nao envia
#   enviar_agora   -> manda um lote ja, fora do horario
#   listar_grupos  -> mostra os grupos do chip e seus IDs
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        default: teste
        options: [teste, enviar_agora, listar_grupos]

concurrency:
  group: robo-whatsapp
  cancel-in-progress: false

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests tzdata pillow

      - name: Rodar o robo do WhatsApp
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCIA: ${{ secrets.WHATSAPP_INSTANCIA }}
          WHATSAPP_GRUPO_ID: ${{ secrets.WHATSAPP_GRUPO_ID }}
          MODO: ${{ github.event.inputs.modo || 'agendado' }}
        run: |
          case "$MODO" in
            listar_grupos) python robo_whatsapp.py --listar-grupos ;;
            teste)         python robo_whatsapp.py --teste ;;
            enviar_agora)  python robo_whatsapp.py --agora ;;
            *)             python robo_whatsapp.py ;;
          esac
