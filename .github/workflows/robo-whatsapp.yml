name: Robo WhatsApp - Ofertas no grupo

# Roda de hora em hora, mas SO envia nos horarios escolhidos na pagina
# /whatsapp do Radar web (padrao 9h, 12h e 19h de Brasilia) e se o robo
# estiver ligado la. Nas outras horas ele so confere e encerra em segundos.
# Enquanto os Secrets WHATSAPP_* nao existirem, ele so avisa e nao envia.
#
# Manual: Actions -> Robo WhatsApp -> Run workflow, escolhendo o modo:
#   teste          -> so mostra o proximo lote como avisos, nao envia
#   enviar_agora   -> manda um lote ja, fora do horario
#   listar_grupos  -> mostra os grupos do chip e seus IDs
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        type: choice
        default: teste
        options: [teste, enviar_agora, listar_grupos]

concurrency:
  group: robo-whatsapp
  cancel-in-progress: false

jobs:
  ofertas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests tzdata

      - name: Rodar o robo do WhatsApp
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_INSTANCIA: ${{ secrets.WHATSAPP_INSTANCIA }}
          WHATSAPP_GRUPO_ID: ${{ secrets.WHATSAPP_GRUPO_ID }}
          MODO: ${{ github.event.inputs.modo || 'agendado' }}
        run: |
          case "$MODO" in
            listar_grupos) python robo_whatsapp.py --listar-grupos ;;
            teste)         python robo_whatsapp.py --teste ;;
            enviar_agora)  python robo_whatsapp.py --agora ;;
            *)             python robo_whatsapp.py ;;
          esac
