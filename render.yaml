# Deploy da versao web (pasta web/) no Render.
# Painel: https://dashboard.render.com  ->  New  ->  Blueprint  ->  aponta pro repo.
#
# As credenciais (sync: false) NAO ficam neste arquivo nem no Git: sao
# preenchidas no painel do Render, na aba Environment do servico.
services:
  - type: web
    name: radar-afiliados-web
    runtime: python
    plan: free                       # troque para "standard" se o video der OOM
    region: oregon
    buildCommand: pip install -r web/requirements.txt
    startCommand: gunicorn web.app_web:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FLASK_DEBUG
        value: "0"
      # --- credenciais: preencher no painel (valores nunca vao pro Git) ---
      - key: SHOPEE_APP_ID
        sync: false
      - key: SHOPEE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_USUARIO
        sync: false
      - key: WEB_SENHA
        sync: false
      # --- Instagram (publicar Reel) - Meta for Developers ---
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      # --- Kairogen (geracao de imagem/video por IA) ---
      # O refresh_token do Kairogen rotaciona a cada uso; o token novo fica
      # no Upstash (cofrinho), nao no Render. Ver web/kairogen_auth.py.
      # CLIENT_ID e TOKEN_URL tem default no codigo (so preencher p/ trocar).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: KAIROGEN_REFRESH_TOKEN
        sync: false
      # --- Galeria (guarda os videos/fotos gerados - Cloudinary) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # --- opcional: reduzir o video se a memoria apertar no plano free ---
      # - key: VIDEO_LARGURA
      #   value: "720"
      # - key: VIDEO_ALTURA
      #   value: "1280"
