# Robo do WhatsApp no Railway: o Railway liga o robo a cada 10 minutos, ele
# confere se esta numa faixa da pagina /whatsapp e desliga. O cron e' UTC, mas
# "a cada 10 minutos" nao muda com o fuso. Vale o que estiver em Settings.
[deploy]
startCommand = "python robo_whatsapp.py"
cronSchedule = "*/10 * * * *"
restartPolicyType = "NEVER"
